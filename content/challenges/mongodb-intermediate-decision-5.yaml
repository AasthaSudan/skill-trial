slug: mongodb-intermediate-decision-5
family: mongodb.decision-5.intermediate
skill: mongodb
type: scenario
level: intermediate
minutes: 6
title: Concurrent counter
statement: MongoDB scenario assessment. Two clients must increment the same document counter. Which operation
  avoids lost read-modify-write updates? Choose the response that satisfies the stated technical requirement.
  This task assesses decisions and reasoning rather than running a full application.
competencies:
- indexes_performance
questions:
- id: q1
  prompt: Two clients must increment the same document counter. Which operation avoids lost read-modify-write
    updates?
  options:
  - id: q1-1
    text: Use the atomic $inc operator
  - id: q1-2
    text: Read the value into each client and overwrite value + 1
  - id: q1-3
    text: Store the counter only in client memory
answers:
  q1: q1-1
answer_rationale:
- Use the atomic $inc operator.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
