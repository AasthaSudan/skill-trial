slug: sql-customer-rollup
skill: sql
family: sql.customer-rollup.advanced
type: sql
title: Customer event rollup
statement: Return one row per customer with id, count of matched orders, and total amount. Keep repeated
  order events, show customers with no matches, treat a NULL amount as zero in the total, ignore orders
  with no customer, and order by customer id.
competencies: &id001
- aggregation
- duplicates
- null_handling
- joins
language: sql
schema: CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, email TEXT); CREATE TABLE orders
  (id INTEGER PRIMARY KEY, customer_id INTEGER, amount REAL);
sample_rows:
  customers:
  - - 1
    - Ada
    - ada@example.com
  - - 2
    - Lin
    - null
  orders:
  - - 1
    - 1
    - 20
starter: 'SELECT 1

  -- Build the requested result.

  '
reference: SELECT c.id,COUNT(o.id),COALESCE(SUM(o.amount),0) FROM customers c LEFT JOIN orders o ON
  o.customer_id=c.id GROUP BY c.id ORDER BY c.id
hints:
- Translate each output row into a precise group or relationship.
- Test missing values, unmatched keys, and repeated events.
- Make ordering explicit when the result contract requires it.
