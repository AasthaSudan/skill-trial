type: coding
title: A positive contribution
statement: Return the sum of all **strictly positive** values in nums. Zero and negative
  values contribute nothing. For an empty array return 0. The total can exceed a 32-bit
  integer.
competencies: &id001
- algorithms
- edge_cases
language: java
starter: "class Solution {\n    public static Object solve(int[] nums) {\n       \
  \ // Return the requested value.\n        return null;\n    }\n}\n"
reference: class Solution { public static Object solve(int[] nums) { long sum=0;for(int
  n:nums)if(n>0)sum+=n;return sum; } }
hints:
- Trace the simplest input before coding.
- Consider empty arrays, duplicates, and negative values.
- A set separates distinct values from occurrences.
