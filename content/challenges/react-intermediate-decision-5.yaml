slug: react-intermediate-decision-5
family: react.decision-5.intermediate
skill: react
type: scenario
level: intermediate
minutes: 6
title: Effect cleanup
statement: React scenario assessment. An effect subscribes to a room that can change. What should cleanup
  do? Choose the response that satisfies the stated technical requirement. This task assesses decisions
  and reasoning rather than running a full application.
competencies:
- effects_data
questions:
- id: q1
  prompt: An effect subscribes to a room that can change. What should cleanup do?
  options:
  - id: q1-1
    text: Unsubscribe the previous room before the next subscription or unmount
  - id: q1-2
    text: Leave every old subscription active
  - id: q1-3
    text: Subscribe during render and skip cleanup
answers:
  q1: q1-1
answer_rationale:
- Unsubscribe the previous room before the next subscription or unmount.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
