slug: nodejs-advanced-decision-7
family: nodejs.decision-7.advanced
skill: nodejs
type: scenario
level: advanced
minutes: 8
title: Backpressure
statement: Node.js scenario assessment. A producer writes faster than a stream consumer can read. What
  prevents unbounded buffering? Choose the response that satisfies the stated technical requirement. This
  task assesses decisions and reasoning rather than running a full application.
competencies:
- async_execution
questions:
- id: q1
  prompt: A producer writes faster than a stream consumer can read. What prevents unbounded buffering?
  options:
  - id: q1-1
    text: Respect the write return value and wait for drain or use a proper pipeline
  - id: q1-2
    text: Keep writing into an unbounded in-memory array
  - id: q1-3
    text: Disable error events on the destination
answers:
  q1: q1-1
answer_rationale:
- Respect the write return value and wait for drain or use a proper pipeline.
hints:
