title: Count equal neighboring pairs
statement: Return the number of adjacent index pairs with equal values. For [4,4,4], the pairs at indexes
  (0,1) and (1,2) give 2. Equal values separated by another value do not form a pair. Empty and single-element
  arrays return 0. Input contains at most 10,000 signed 32-bit integers. Implement solve(nums).
competencies: &id001
- collections
- algorithms
- edge_cases
language: python
starter: "def solve(nums):\n    return None\n"
reference: "def solve(nums):\n    return sum(nums[i] == nums[i-1] for i in range(1, len(nums)))"
