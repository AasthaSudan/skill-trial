slug: kubernetes-intermediate-decision-4
family: kubernetes.decision-4.intermediate
skill: kubernetes
type: scenario
level: intermediate
minutes: 6
title: Readiness meaning
statement: Kubernetes scenario assessment. A Pod is alive but cannot serve requests yet. Which probe should
  control ordinary Service readiness? Choose the response that satisfies the stated technical requirement.
  This task assesses decisions and reasoning rather than running a full application.
competencies:
- workloads_services
questions:
- id: q1
  prompt: A Pod is alive but cannot serve requests yet. Which probe should control ordinary Service readiness?
  options:
  - id: q1-1
    text: A readiness probe reflecting ability to serve
  - id: q1-2
    text: A liveness probe that always returns true
  - id: q1-3
    text: No readiness signal and route all traffic immediately
answers:
  q1: q1-1
answer_rationale:
- A readiness probe reflecting ability to serve.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
