type: coding
title: Best three-step window
statement: Return the greatest sum of any contiguous window of exactly three integers. Return null
  when fewer than three values are supplied. The input can contain negative numbers and up to 100,000
  values.
competencies: &id001
- collections
- algorithms
- edge_cases
language: javascript
starter: "function solve(nums) {\n  // Return the requested result.\n  return null;\n}"
reference: function solve(nums) { if(nums.length<3)return null; let s=nums[0]+nums[1]+nums[2],best=s;
  for(let i=3;i<nums.length;i++){s+=nums[i]-nums[i-3];if(s>best)best=s;} return best; }
