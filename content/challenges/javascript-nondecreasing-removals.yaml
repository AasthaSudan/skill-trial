title: Fewest removals for ordered data
statement: Return the minimum number of elements to remove so the remaining values, kept in their
  original order, are non-decreasing. Equal values may remain. Use an algorithm suitable for 100,000
  values.
competencies: &id001
- collections
- algorithms
- edge_cases
language: javascript
starter: "function solve(nums) {\n  // Return the requested result.\n  return null;\n}"
reference: function solve(nums) { const tails=[]; for(const x of nums){let lo=0,hi=tails.length;while(lo<hi){const
  m=(lo+hi)>>1;if(tails[m]<=x)lo=m+1;else hi=m;}tails[lo]=x;} return nums.length-tails.length; }
