level: intermediate
minutes: 6
title: Context propagation
statement: Go scenario assessment. An HTTP handler calls a downstream operation. How should cancellation
  normally flow? Choose the response that satisfies the stated technical requirement. This task assesses
  decisions and reasoning rather than running a full application.
competencies:
- values_interfaces
questions:
- id: q1
  prompt: An HTTP handler calls a downstream operation. How should cancellation normally flow?
  options:
  - id: q1-1
    text: Pass a suitable request context into operations that support it
  - id: q1-2
    text: Replace every context with an uncancellable background context
  - id: q1-3
    text: Keep the request alive forever after client disconnect
answers:
  q1: q1-1
answer_rationale:
- Pass a suitable request context into operations that support it.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
