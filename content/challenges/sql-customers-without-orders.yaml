  dataset: CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, email TEXT);
    CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount REAL);INSERT
    INTO customers VALUES (1,'Ada','ada@example.com'),(2,'Lin',NULL),(3,'Sam','sam@example.com');
    INSERT INTO orders VALUES (1,1,20),(2,1,30),(3,3,15);
  expected:
  - - 2
    - Lin
  visibility: sample
  competencies: *id001
