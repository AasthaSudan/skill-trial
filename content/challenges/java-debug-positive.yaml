title: The refund that reduced the total
statement: A report should sum **strictly positive** amounts, but negative adjustments
  are reducing the result. Fix solve(nums), returning 0 for an empty array. Preserve
  correct behavior for ordinary positive values and use a sufficiently large numeric
  type.
competencies:
- algorithms
- edge_cases
language: java
starter: class Solution { public static Object solve(int[] nums) { long sum=0;for(int
  n:nums)sum+=n;return sum; } }
reference: class Solution { public static Object solve(int[] nums) { long sum=0;for(int
  n:nums)if(n>0)sum+=n;return sum; } }
hints:
- Compare the stated behavior with what the loop includes.
- A value must satisfy a condition before it contributes.
