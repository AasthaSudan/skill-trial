level: intermediate
minutes: 6
title: Resource cleanup
statement: FastAPI scenario assessment. A dependency opens a database session for a request. How can it
  ensure cleanup? Choose the response that satisfies the stated technical requirement. This task assesses
  decisions and reasoning rather than running a full application.
competencies:
- request_validation
questions:
- id: q1
  prompt: A dependency opens a database session for a request. How can it ensure cleanup?
  options:
  - id: q1-1
    text: Use a properly scoped dependency with a cleanup/finally boundary
  - id: q1-2
    text: Store all request sessions in a shared global list forever
  - id: q1-3
    text: Close the session before the endpoint starts
answers:
  q1: q1-1
answer_rationale:
- Use a properly scoped dependency with a cleanup/finally boundary.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
