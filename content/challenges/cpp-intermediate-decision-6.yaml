title: Checked boundary
statement: C++ scenario assessment. An untrusted index arrives for a vector read. What should the code
  do? Choose the response that satisfies the stated technical requirement. This task assesses decisions
  and reasoning rather than running a full application.
competencies:
- bounds_correctness
questions:
- id: q1
  prompt: An untrusted index arrives for a vector read. What should the code do?
  options:
  - id: q1-1
    text: Validate the index or use the appropriate checked access and handle failure
  - id: q1-2
    text: Use unchecked access regardless of the index
  - id: q1-3
    text: Cast every negative index to a large unsigned value and continue
answers:
  q1: q1-1
answer_rationale:
- Validate the index or use the appropriate checked access and handle failure.
