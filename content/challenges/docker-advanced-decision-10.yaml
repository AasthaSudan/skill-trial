slug: docker-advanced-decision-10
family: docker.decision-10.advanced
skill: docker
type: scenario
level: advanced
minutes: 8
title: Disk exhaustion
statement: Docker scenario assessment. Logs and stale layers fill the host. What is a safe response? Choose
  the response that satisfies the stated technical requirement. This task assesses decisions and reasoning
  rather than running a full application.
competencies:
- images_builds
- containers_networking
- volumes_security
questions:
- id: q1
  prompt: Logs and stale layers fill the host. What is a safe response?
  options:
  - id: q1-1
    text: Bound log retention and remove verified unused artifacts while preserving persistent volumes
  - id: q1-2
    text: Delete every volume including the production database
  - id: q1-3
    text: Hide the disk alert and keep unlimited logging
answers:
  q1: q1-1
answer_rationale:
- Bound log retention and remove verified unused artifacts while preserving persistent volumes.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
