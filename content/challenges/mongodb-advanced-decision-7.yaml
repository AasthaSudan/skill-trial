title: Multi-document transaction
statement: MongoDB scenario assessment. A business invariant spans several documents and must commit together.
  What is needed? Choose the response that satisfies the stated technical requirement. This task assesses
  decisions and reasoning rather than running a full application.
competencies:
- documents_queries
questions:
- id: q1
  prompt: A business invariant spans several documents and must commit together. What is needed?
  options:
  - id: q1-1
    text: A supported transaction boundary and correct session/commit handling
  - id: q1-2
    text: Assume all multi-document writes are always one atomic operation
  - id: q1-3
    text: Disable write acknowledgments
answers:
  q1: q1-1
answer_rationale:
- A supported transaction boundary and correct session/commit handling.
