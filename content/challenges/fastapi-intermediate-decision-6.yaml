slug: fastapi-intermediate-decision-6
family: fastapi.decision-6.intermediate
skill: fastapi
type: scenario
level: intermediate
minutes: 6
title: Ownership check
statement: FastAPI scenario assessment. A signed-in caller requests another user's report ID. What must
  the API check? Choose the response that satisfies the stated technical requirement. This task assesses
  decisions and reasoning rather than running a full application.
competencies:
- async_persistence
questions:
- id: q1
  prompt: A signed-in caller requests another user's report ID. What must the API check?
  options:
  - id: q1-1
    text: Resource ownership or an explicit permitted access grant on the server
  - id: q1-2
    text: Only that the caller knows a valid UUID
  - id: q1-3
    text: Only that the frontend hides the button
answers:
  q1: q1-1
answer_rationale:
- Resource ownership or an explicit permitted access grant on the server.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
