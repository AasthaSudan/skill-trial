slug: mongodb-advanced-decision-10
family: mongodb.decision-10.advanced
skill: mongodb
type: scenario
level: advanced
minutes: 8
title: Migration compatibility
statement: MongoDB scenario assessment. Old and new app versions overlap during a schema change. Which
  approach is safer? Choose the response that satisfies the stated technical requirement. This task assesses
  decisions and reasoning rather than running a full application.
competencies:
- documents_queries
- indexes_performance
- consistency_updates
questions:
- id: q1
  prompt: Old and new app versions overlap during a schema change. Which approach is safer?
  options:
  - id: q1-1
    text: Use a staged compatible migration and verify both versions before removing old fields
  - id: q1-2
    text: Delete old fields before deploying readers that tolerate the change
  - id: q1-3
    text: Assume documents cannot evolve
answers:
  q1: q1-1
answer_rationale:
- Use a staged compatible migration and verify both versions before removing old fields.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
