title: Closest distinct values
statement: Return the smallest absolute difference between any two distinct values. Repeated copies
  of one value do not form a pair. Return null when fewer than two distinct values exist. Integer
  endpoints may be far apart.
competencies: &id001
- collections
- algorithms
- edge_cases
language: python
starter: "def solve(nums):\n    # Return the requested result.\n    return None\n"
reference: "def solve(nums):\n    vals=sorted(set(nums))\n    if len(vals)<2:return None\n    return\
  \ min(vals[i]-vals[i-1] for i in range(1,len(vals)))"
