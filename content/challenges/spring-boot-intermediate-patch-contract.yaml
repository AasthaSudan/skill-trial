slug: spring-boot-intermediate-patch-contract
family: spring-boot.patch-contract.intermediate
skill: spring-boot
type: scenario
level: intermediate
minutes: 6
title: Preserve PATCH field semantics
statement: PATCH /profiles accepts optional fields. A missing field means leave it unchanged, while an
  explicit clear action must remain distinguishable. Invalid changes should fail before business writes.
competencies:
- rest_apis
- validation
questions:
- id: q1
  prompt: How should missing and explicit clearing be represented?
  options:
  - id: q1-1
    text: Use a patch representation that tracks field presence separately from value
  - id: q1-2
    text: Treat every missing field as a request to erase it
  - id: q1-3
    text: Reuse a full replacement DTO and overwrite every field
- id: q2
  prompt: When should cross-field validation run?
  options:
  - id: q2-1
    text: Validate the proposed merged state before committing the update
  - id: q2-2
    text: Only validate field names after sending success
  - id: q2-3
    text: Skip validation for PATCH requests
answers:
  q1: q1-1
  q2: q2-1
answer_rationale:
- Presence is needed to distinguish no change from explicit clear.
- Validating the resulting state preserves business constraints.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
