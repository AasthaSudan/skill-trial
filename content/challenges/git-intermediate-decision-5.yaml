slug: git-intermediate-decision-5
family: git.decision-5.intermediate
skill: git
type: scenario
level: intermediate
minutes: 6
title: Undo a shared commit
statement: Git scenario assessment. A bad commit has already reached a branch used by others. What preserves
  shared history? Choose the response that satisfies the stated technical requirement. This task assesses
  decisions and reasoning rather than running a full application.
competencies:
- merges_conflicts
questions:
- id: q1
  prompt: A bad commit has already reached a branch used by others. What preserves shared history?
  options:
  - id: q1-1
    text: Create a revert commit and review the resulting diff
  - id: q1-2
    text: Reset the shared branch and force-push without coordination
  - id: q1-3
    text: Delete the remote branch immediately
answers:
  q1: q1-1
answer_rationale:
- Create a revert commit and review the resulting diff.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
