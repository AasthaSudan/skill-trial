minutes: 8
title: Shared map race
statement: Go scenario assessment. Multiple goroutines mutate a normal map concurrently. What is required?
  Choose the response that satisfies the stated technical requirement. This task assesses decisions and
  reasoning rather than running a full application.
competencies:
- goroutines_channels
questions:
- id: q1
  prompt: Multiple goroutines mutate a normal map concurrently. What is required?
  options:
  - id: q1-1
    text: Synchronization or an appropriate concurrent ownership design
  - id: q1-2
    text: Only giving each goroutine a different variable name for the same map
  - id: q1-3
    text: Assuming reads and writes are always safe without coordination
answers:
  q1: q1-1
answer_rationale:
- Synchronization or an appropriate concurrent ownership design.
