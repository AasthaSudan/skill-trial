slug: css-beginner-decision-3
family: css.decision-3.beginner
skill: css
type: scenario
level: beginner
minutes: 4
title: Reduced motion
statement: CSS scenario assessment. How can a design respect a user's reduced-motion preference? Choose
  the response that satisfies the stated technical requirement. This task assesses decisions and reasoning
  rather than running a full application.
competencies:
- accessibility_motion
questions:
- id: q1
  prompt: How can a design respect a user's reduced-motion preference?
  options:
  - id: q1-1
    text: Use prefers-reduced-motion to reduce nonessential animation
  - id: q1-2
    text: Force every animation to run at maximum speed
  - id: q1-3
    text: Remove all text when the preference is enabled
answers:
  q1: q1-1
answer_rationale:
- Use prefers-reduced-motion to reduce nonessential animation.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
