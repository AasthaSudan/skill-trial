slug: nodejs-intermediate-decision-4
family: nodejs.decision-4.intermediate
skill: nodejs
type: scenario
level: intermediate
minutes: 6
title: CPU-bound endpoint
statement: Node.js scenario assessment. A large CPU calculation stalls unrelated requests. What addresses
  the event-loop bottleneck? Choose the response that satisfies the stated technical requirement. This
  task assesses decisions and reasoning rather than running a full application.
competencies:
- async_execution
questions:
- id: q1
  prompt: A large CPU calculation stalls unrelated requests. What addresses the event-loop bottleneck?
  options:
  - id: q1-1
    text: Move CPU work to worker threads or a separate bounded worker
  - id: q1-2
    text: Wrap the same synchronous computation in async without moving it
  - id: q1-3
    text: Increase the number of awaited timers around the loop
answers:
  q1: q1-1
answer_rationale:
- Move CPU work to worker threads or a separate bounded worker.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
