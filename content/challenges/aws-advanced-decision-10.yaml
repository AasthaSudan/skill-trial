slug: aws-advanced-decision-10
family: aws.decision-10.advanced
skill: aws
type: scenario
level: advanced
minutes: 8
title: Cross-region writes
statement: AWS scenario assessment. Two regions may both retry the same business write during failover.
  What must the design specify? Choose the response that satisfies the stated technical requirement. This
  task assesses decisions and reasoning rather than running a full application.
competencies:
- identity_access
- compute_scaling
- storage_reliability
questions:
- id: q1
  prompt: Two regions may both retry the same business write during failover. What must the design specify?
  options:
  - id: q1-1
    text: Conflict resolution, idempotency and an explicit consistency/failover policy
  - id: q1-2
    text: Assume geographic distance removes all races
  - id: q1-3
    text: Silently accept duplicate financial actions
answers:
  q1: q1-1
answer_rationale:
- Conflict resolution, idempotency and an explicit consistency/failover policy.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
