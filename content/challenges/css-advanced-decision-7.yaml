slug: css-advanced-decision-7
family: css.decision-7.advanced
skill: css
type: scenario
level: advanced
minutes: 8
title: Overflow boundary
statement: CSS scenario assessment. A nested flex item causes horizontal page overflow despite a flexible
  parent. What should be investigated? Choose the response that satisfies the stated technical requirement.
  This task assesses decisions and reasoning rather than running a full application.
competencies:
- cascade_selectors
questions:
- id: q1
  prompt: A nested flex item causes horizontal page overflow despite a flexible parent. What should be
    investigated?
  options:
  - id: q1-1
    text: Intrinsic minimum sizing, content wrapping and an appropriate min-width boundary
  - id: q1-2
    text: Hide all body overflow without inspecting inaccessible content
  - id: q1-3
    text: Remove every viewport meta tag
answers:
  q1: q1-1
answer_rationale:
- Intrinsic minimum sizing, content wrapping and an appropriate min-width boundary.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
