slug: fastapi-advanced-decision-7
family: fastapi.decision-7.advanced
skill: fastapi
type: scenario
level: advanced
minutes: 8
title: Dependency override
statement: FastAPI scenario assessment. A test must replace a real external dependency without changing
  production behavior. What is appropriate? Choose the response that satisfies the stated technical requirement.
  This task assesses decisions and reasoning rather than running a full application.
competencies:
- request_validation
questions:
- id: q1
  prompt: A test must replace a real external dependency without changing production behavior. What is
    appropriate?
  options:
  - id: q1-1
    text: Use a scoped dependency override and remove it after the test
  - id: q1-2
    text: Hardcode fake results in the production endpoint
  - id: q1-3
    text: Disable authentication for every environment
answers:
  q1: q1-1
answer_rationale:
- Use a scoped dependency override and remove it after the test.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
