title: Input label
statement: HTML scenario assessment. How should a text input receive a visible associated label? Choose
  the response that satisfies the stated technical requirement. This task assesses decisions and reasoning
  rather than running a full application.
competencies:
- forms_validation
questions:
- id: q1
  prompt: How should a text input receive a visible associated label?
  options:
  - id: q1-1
    text: Use a label correctly associated with the input
  - id: q1-2
    text: Use only an unrelated nearby paragraph
  - id: q1-3
    text: Use an empty placeholder as the only name
answers:
