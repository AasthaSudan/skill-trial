slug: docker-advanced-decision-7
family: docker.decision-7.advanced
skill: docker
type: scenario
level: advanced
minutes: 8
title: Image supply chain
statement: Docker scenario assessment. A deployment must reproduce an approved image exactly. Which reference
  is strongest? Choose the response that satisfies the stated technical requirement. This task assesses
  decisions and reasoning rather than running a full application.
competencies:
- images_builds
questions:
- id: q1
  prompt: A deployment must reproduce an approved image exactly. Which reference is strongest?
  options:
  - id: q1-1
    text: An approved image digest with provenance checks
  - id: q1-2
    text: A mutable latest tag with no verification
  - id: q1-3
    text: An image name copied from an unknown chat
answers:
  q1: q1-1
answer_rationale:
- An approved image digest with provenance checks.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
