title: Typed nil interface
statement: Go scenario assessment. An interface contains a typed nil pointer. Why can a comparison with
  nil be false? Choose the response that satisfies the stated technical requirement. This task assesses
  decisions and reasoning rather than running a full application.
competencies:
- errors_context
questions:
- id: q1
  prompt: An interface contains a typed nil pointer. Why can a comparison with nil be false?
  options:
  - id: q1-1
    text: The interface still holds a dynamic type as well as a nil dynamic value
  - id: q1-2
    text: Interfaces never store type information
  - id: q1-3
    text: The compiler silently allocates an instance for every nil pointer
answers:
  q1: q1-1
answer_rationale:
- The interface still holds a dynamic type as well as a nil dynamic value.
