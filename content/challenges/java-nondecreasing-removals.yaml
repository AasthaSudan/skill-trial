title: Fewest removals for ordered data
statement: Return the minimum number of elements to remove so the remaining values, kept in their
  original order, are non-decreasing. Equal values may remain. Use an algorithm suitable for 100,000
  values.
competencies: &id001
- collections
- algorithms
- edge_cases
language: java
starter: "class Solution {\n    public static Object solve(int[] nums) {\n        // Return the requested\
  \ result.\n        return null;\n    }\n}"
reference: class Solution { public static Object solve(int[] nums) { int[] tails=new int[nums.length];
  int n=0; for(int x:nums){int lo=0,hi=n;while(lo<hi){int m=(lo+hi)>>>1;if(tails[m]<=x)lo=m+1;else
  hi=m;}tails[lo]=x;if(lo==n)n++;} return nums.length-n; } }
