title: Optimistic concurrency
statement: .NET scenario assessment. Two requests update the same business row. What can detect a conflicting
  stale write? Choose the response that satisfies the stated technical requirement. This task assesses
  decisions and reasoning rather than running a full application.
competencies:
- api_configuration
questions:
- id: q1
  prompt: Two requests update the same business row. What can detect a conflicting stale write?
  options:
  - id: q1-1
    text: A configured concurrency token and deliberate conflict handling
  - id: q1-2
    text: Only changing the response message after overwriting data
  - id: q1-3
    text: Disabling every database constraint
answers:
  q1: q1-1
answer_rationale:
- A configured concurrency token and deliberate conflict handling.
