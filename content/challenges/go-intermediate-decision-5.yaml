slug: go-intermediate-decision-5
family: go.decision-5.intermediate
skill: go
type: scenario
level: intermediate
minutes: 6
title: Interface contract
statement: Go scenario assessment. How does a concrete Go type satisfy an interface? Choose the response
  that satisfies the stated technical requirement. This task assesses decisions and reasoning rather than
  running a full application.
competencies:
- goroutines_channels
questions:
- id: q1
  prompt: How does a concrete Go type satisfy an interface?
  options:
  - id: q1-1
    text: Its method set satisfies the interface's required methods
  - id: q1-2
    text: It must always declare an implements keyword
  - id: q1-3
    text: Its source file must have the same name as the interface
answers:
  q1: q1-1
answer_rationale:
- Its method set satisfies the interface's required methods.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
