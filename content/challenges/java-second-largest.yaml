slug: java-second-largest
skill: java
family: java.second-largest
type: coding
title: Second largest, not second last
statement: Return the second largest **distinct** integer in nums, or null if fewer
  than two distinct values exist. Input is an array of up to 10,000 integers. Do not
  modify the input.
competencies: &id001
- collections
- algorithms
- edge_cases
language: java
starter: "class Solution {\n    public static Object solve(int[] nums) {\n       \
  \ // Return the requested value.\n        return null;\n    }\n}\n"
reference: class Solution { public static Object solve(int[] nums) { java.util.TreeSet<Integer>
  s=new java.util.TreeSet<>(); for(int n:nums)s.add(n); if(s.size()<2)return null;
  s.pollLast(); return s.last(); } }
hints:
- Trace the simplest input before coding.
- Consider empty arrays, duplicates, and negative values.
- A set separates distinct values from occurrences.
