title: Optional property semantics
statement: TypeScript scenario assessment. An update must distinguish an absent property from an explicitly
  provided undefined value. What should the contract do? Choose the response that satisfies the stated
  technical requirement. This task assesses decisions and reasoning rather than running a full application.
competencies:
- generics_contracts
questions:
- id: q1
  prompt: An update must distinguish an absent property from an explicitly provided undefined value. What
    should the contract do?
  options:
  - id: q1-1
    text: Represent presence explicitly and enable suitable strict optional-property checks
  - id: q1-2
    text: Assume absence and undefined are always interchangeable business actions
  - id: q1-3
    text: Serialize every absent field as a destructive update
answers:
  q1: q1-1
answer_rationale:
- Represent presence explicitly and enable suitable strict optional-property checks.
