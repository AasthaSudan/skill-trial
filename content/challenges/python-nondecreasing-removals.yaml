reference: "from bisect import bisect_right\ndef solve(nums):\n    tails=[]\n    for x in nums:\n\
  \        i=bisect_right(tails,x)\n        if i==len(tails):tails.append(x)\n        else:tails[i]=x\n\
  \    return len(nums)-len(tails)"
