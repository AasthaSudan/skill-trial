slug: spring-boot-intermediate-service-validation
family: spring-boot.service-validation.intermediate
skill: spring-boot
type: scenario
level: intermediate
minutes: 6
title: Keep business rules at the service boundary
statement: An order can be created by HTTP and by a scheduled job. Both entry points must apply the same
  credit-limit rule and return safe domain errors.
competencies:
- services
- validation
- exceptions
questions:
- id: q1
  prompt: Where should the shared credit-limit rule run?
  options:
  - id: q1-1
    text: In the application/service boundary used by both entry points
  - id: q1-2
    text: Only in the HTTP controller
  - id: q1-3
    text: Only in browser JavaScript
- id: q2
  prompt: What should a failed business rule expose over HTTP?
  options:
  - id: q2-1
    text: A deliberate client-facing error contract without internal stack traces
  - id: q2-2
    text: The database password and raw SQL exception
  - id: q2-3
    text: A success status containing an unstructured exception string
answers:
  q1: q1-1
  q2: q2-1
answer_rationale:
- A shared service rule covers every caller.
- Domain error mapping makes the failure actionable without disclosing internals.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
