slug: react-advanced-decision-8
family: react.decision-8.advanced
skill: react
type: scenario
level: advanced
minutes: 8
title: External store consistency
statement: React scenario assessment. Multiple components read an external mutable store during concurrent
  rendering. Which integration preserves snapshots? Choose the response that satisfies the stated technical
  requirement. This task assesses decisions and reasoning rather than running a full application.
competencies:
- effects_data
questions:
- id: q1
  prompt: Multiple components read an external mutable store during concurrent rendering. Which integration
    preserves snapshots?
  options:
  - id: q1-1
    text: Use useSyncExternalStore with a stable snapshot contract
  - id: q1-2
    text: Read and mutate the store directly during render
  - id: q1-3
    text: Call a setter unconditionally from every render
answers:
  q1: q1-1
answer_rationale:
- Use useSyncExternalStore with a stable snapshot contract.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
