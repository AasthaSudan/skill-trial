slug: java-window-triple-maximum
skill: java
family: java.window-triple-maximum.advanced
type: coding
title: Best three-step window
statement: Return the greatest sum of any contiguous window of exactly three integers. Return null
  when fewer than three values are supplied. The input can contain negative numbers and up to 100,000
  values.
competencies: &id001
- collections
- algorithms
- edge_cases
language: java
starter: "class Solution {\n    public static Object solve(int[] nums) {\n        // Return the requested\
  \ result.\n        return null;\n    }\n}"
reference: class Solution { public static Object solve(int[] nums) { if(nums.length<3)return null;
  long sum=(long)nums[0]+nums[1]+nums[2],best=sum; for(int i=3;i<nums.length;i++){sum+=(long)nums[i]-nums[i-3];best=Math.max(best,sum);}
  return best; } }
hints:
- Identify the invariant that stays true as the input is scanned.
- Work through empty, repeated, and boundary-valued inputs.
- Choose a time and memory bound that fits the stated input size.
