slug: spring-boot-intermediate-concurrent-stock
family: spring-boot.concurrent-stock.intermediate
skill: spring-boot
type: scenario
level: intermediate
minutes: 6
title: Prevent lost stock updates
statement: Two requests read the same stock count and each writes a decremented value. The application
  must detect conflicting updates and preserve the stock invariant.
competencies:
- persistence
- transactions
questions:
- id: q1
  prompt: Which mechanism detects a stale entity update?
  options:
  - id: q1-1
    text: Use an optimistic version field and handle the conflict
  - id: q1-2
    text: Keep stock in an unsynchronized controller field
  - id: q1-3
    text: Use a larger HTTP timeout
- id: q2
  prompt: How should a rejected concurrent update be handled?
  options:
  - id: q2-1
    text: Reload/retry under a bounded policy or return a deliberate conflict
  - id: q2-2
    text: Return success without checking the database result
  - id: q2-3
    text: Silently overwrite the newer value
answers:
  q1: q1-1
  q2: q2-1
answer_rationale:
- Optimistic version checks reject a write based on stale state.
- A bounded conflict policy preserves correctness and client semantics.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
