slug: fastapi-intermediate-decision-5
family: fastapi.decision-5.intermediate
skill: fastapi
type: scenario
level: intermediate
minutes: 6
title: Blocking I/O
statement: FastAPI scenario assessment. An async route directly calls a slow synchronous library. What
  prevents event-loop blocking? Choose the response that satisfies the stated technical requirement. This
  task assesses decisions and reasoning rather than running a full application.
competencies:
- dependencies_auth
questions:
- id: q1
  prompt: An async route directly calls a slow synchronous library. What prevents event-loop blocking?
  options:
  - id: q1-1
    text: Use an async client or move blocking work to the appropriate threadpool boundary
  - id: q1-2
    text: Add async to the function name only
  - id: q1-3
    text: Call time.sleep repeatedly in the event loop
answers:
  q1: q1-1
answer_rationale:
- Use an async client or move blocking work to the appropriate threadpool boundary.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
