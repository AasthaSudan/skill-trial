title: Channel coordination
statement: Go scenario assessment. A producer sends results and signals completion. Who should usually
  close the result channel? Choose the response that satisfies the stated technical requirement. This
  task assesses decisions and reasoning rather than running a full application.
competencies:
- errors_context
questions:
- id: q1
  prompt: A producer sends results and signals completion. Who should usually close the result channel?
  options:
  - id: q1-1
    text: The owner responsible for sending, once no more sends can occur
  - id: q1-2
    text: Every receiver independently while producers may still send
  - id: q1-3
    text: An arbitrary unrelated goroutine on every receive
answers:
  q1: q1-1
answer_rationale:
- The owner responsible for sending, once no more sends can occur.
hints:
