slug: sql-filter-orders
skill: sql
family: sql.filter-orders
type: sql
title: Find the meaningful orders
statement: Return **id, amount** for orders whose amount is at least 20. Preserve
  separate orders even when amounts are equal. Sort by amount descending, then id
  ascending.
competencies: &id001
- filtering
- duplicates
language: sql
schema: CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, email TEXT); CREATE
  TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount REAL);
sample_rows:
  customers:
  - - 1
    - Ada
    - ada@example.com
  - - 2
    - Lin
    - null
  - - 3
    - Sam
    - sam@example.com
  orders:
  - - 1
    - 1
    - 20
  - - 2
    - 1
    - 30
  - - 3
    - 3
    - 15
starter: 'SELECT id, amount

  FROM orders

  '
reference: SELECT id,amount FROM orders WHERE amount>=20 ORDER BY amount DESC,id ASC
hints:
- Use the stated output columns and ordering.
- Think about NULL values and repeated rows.
- For totals, join before grouping; avoid SUM(DISTINCT amount).
