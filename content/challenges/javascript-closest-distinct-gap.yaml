slug: javascript-closest-distinct-gap
skill: javascript
family: javascript.closest-distinct-gap.advanced
type: coding
title: Closest distinct values
statement: Return the smallest absolute difference between any two distinct values. Repeated copies
  of one value do not form a pair. Return null when fewer than two distinct values exist. Integer
  endpoints may be far apart.
competencies: &id001
- collections
- algorithms
- edge_cases
language: javascript
starter: "function solve(nums) {\n  // Return the requested result.\n  return null;\n}"
reference: function solve(nums) { const vals=[...new Set(nums)].sort((a,b)=>a-b); if(vals.length<2)return
  null; let best=Infinity; for(let i=1;i<vals.length;i++)best=Math.min(best,vals[i]-vals[i-1]); return
  best; }
