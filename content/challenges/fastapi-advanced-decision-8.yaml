slug: fastapi-advanced-decision-8
family: fastapi.decision-8.advanced
skill: fastapi
type: scenario
level: advanced
minutes: 8
title: Background durability
statement: FastAPI scenario assessment. A response acknowledges a job that must survive process restart.
  What is necessary? Choose the response that satisfies the stated technical requirement. This task assesses
  decisions and reasoning rather than running a full application.
competencies:
- dependencies_auth
questions:
- id: q1
  prompt: A response acknowledges a job that must survive process restart. What is necessary?
  options:
  - id: q1-1
    text: Persist a job before acknowledgment and process it with recoverable worker state
  - id: q1-2
    text: Rely only on an in-process background callback
  - id: q1-3
    text: Return a job ID that is never stored
answers:
  q1: q1-1
answer_rationale:
- Persist a job before acknowledgment and process it with recoverable worker state.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
