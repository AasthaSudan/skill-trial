title: Deployment configuration
statement: .NET scenario assessment. A production deployment accidentally starts with development-only
  settings. What should prevent this? Choose the response that satisfies the stated technical requirement.
  This task assesses decisions and reasoning rather than running a full application.
competencies:
- data_lifetimes
questions:
- id: q1
  prompt: A production deployment accidentally starts with development-only settings. What should prevent
    this?
  options:
  - id: q1-1
    text: Explicit environment configuration, startup validation and deployment checks
  - id: q1-2
    text: Assume the development profile is safe for every host
  - id: q1-3
    text: Expose the developer exception page to all clients
answers:
  q1: q1-1
answer_rationale:
- Explicit environment configuration, startup validation and deployment checks.
