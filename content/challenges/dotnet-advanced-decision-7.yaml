- dependency_injection
questions:
- id: q1
  prompt: A hosted background service processes jobs using scoped dependencies. How should it obtain them?
  options:
  - id: q1-1
    text: Create and dispose an explicit scope for each appropriate unit of work
  - id: q1-2
    text: Retain one request scope after the request ends
  - id: q1-3
    text: Assume a singleton host automatically makes DbContext thread-safe
answers:
  q1: q1-1
answer_rationale:
- Create and dispose an explicit scope for each appropriate unit of work.
