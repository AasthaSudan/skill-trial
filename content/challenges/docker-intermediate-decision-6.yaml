  decisions and reasoning rather than running a full application.
competencies:
- volumes_security
questions:
- id: q1
  prompt: A database password must reach a running application. Which handling is appropriate?
  options:
  - id: q1-1
    text: Provide it through the configured runtime secret mechanism
  - id: q1-2
    text: Bake it into an image layer with a Dockerfile command
  - id: q1-3
    text: Publish it in the image label
answers:
  q1: q1-1
answer_rationale:
- Provide it through the configured runtime secret mechanism.
