title: Bounded memory
statement: Redis scenario assessment. A cache reaches its configured memory bound. What should the operator
  choose deliberately? Choose the response that satisfies the stated technical requirement. This task
  assesses decisions and reasoning rather than running a full application.
competencies:
- cache_reliability
questions:
- id: q1
  prompt: A cache reaches its configured memory bound. What should the operator choose deliberately?
  options:
  - id: q1-1
    text: A suitable eviction policy and behavior for evicted or rejected entries
  - id: q1-2
    text: Assume memory is infinite
  - id: q1-3
    text: Delete the authoritative database to free cache space
answers:
  q1: q1-1
answer_rationale:
- A suitable eviction policy and behavior for evicted or rejected entries.
hints:
