slug: go-advanced-decision-7
family: go.decision-7.advanced
skill: go
type: scenario
level: advanced
minutes: 8
title: Goroutine leak
statement: Go scenario assessment. A producer blocks sending after its consumer exits. What should the
  design provide? Choose the response that satisfies the stated technical requirement. This task assesses
  decisions and reasoning rather than running a full application.
competencies:
- values_interfaces
questions:
- id: q1
  prompt: A producer blocks sending after its consumer exits. What should the design provide?
  options:
  - id: q1-1
    text: A cancellation or completion path that lets the producer stop
  - id: q1-2
    text: An infinite retry loop with no cancellation
  - id: q1-3
    text: A new goroutine for every blocked send forever
answers:
  q1: q1-1
answer_rationale:
- A cancellation or completion path that lets the producer stop.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
