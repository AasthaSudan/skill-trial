title: Disposable resource
statement: C# scenario assessment. A method opens a disposable file stream. How should ownership be expressed?
  Choose the response that satisfies the stated technical requirement. This task assesses decisions and
  reasoning rather than running a full application.
competencies:
- collections_linq
questions:
- id: q1
  prompt: A method opens a disposable file stream. How should ownership be expressed?
  options:
  - id: q1-1
    text: Use a deterministic disposal boundary such as using
  - id: q1-2
    text: Leave every stream open until the machine reboots
  - id: q1-3
    text: Store all streams in a static list
answers:
  q1: q1-1
answer_rationale:
- Use a deterministic disposal boundary such as using.
