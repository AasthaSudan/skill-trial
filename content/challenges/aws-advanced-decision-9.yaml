title: Disaster recovery
statement: AWS scenario assessment. Backups exist but no restore has been attempted. What establishes
  recovery capability? Choose the response that satisfies the stated technical requirement. This task
  assesses decisions and reasoning rather than running a full application.
competencies:
- storage_reliability
questions:
- id: q1
  prompt: Backups exist but no restore has been attempted. What establishes recovery capability?
  options:
  - id: q1-1
    text: Rehearse restore and measure recovery objectives with application checks
  - id: q1-2
    text: Assume a successful backup log proves every restore works
  - id: q1-3
    text: Keep the encryption key only on the failed host
answers:
  q1: q1-1
