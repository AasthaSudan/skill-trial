title: Cancellation contract
statement: C# scenario assessment. A request is cancelled while waiting on downstream I/O. What should
  the method do? Choose the response that satisfies the stated technical requirement. This task assesses
  decisions and reasoning rather than running a full application.
competencies:
- collections_linq
questions:
- id: q1
  prompt: A request is cancelled while waiting on downstream I/O. What should the method do?
  options:
  - id: q1-1
    text: Propagate the cancellation token and clean up owned resources
  - id: q1-2
    text: Catch cancellation and report a fabricated successful result
  - id: q1-3
    text: Keep every abandoned operation alive forever
answers:
  q1: q1-1
answer_rationale:
- Propagate the cancellation token and clean up owned resources.
