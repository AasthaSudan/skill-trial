title: Store an object
statement: AWS scenario assessment. Where does a typical application store durable object uploads? Choose
  the response that satisfies the stated technical requirement. This task assesses decisions and reasoning
  rather than running a full application.
competencies:
- compute_scaling
questions:
- id: q1
  prompt: Where does a typical application store durable object uploads?
  options:
  - id: q1-1
    text: An S3 bucket configured for its access requirements
  - id: q1-2
    text: Only the memory of one compute process
  - id: q1-3
    text: A public source-code comment
answers:
  q1: q1-1
answer_rationale:
- An S3 bucket configured for its access requirements.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
