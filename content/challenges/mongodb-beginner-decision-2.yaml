slug: mongodb-beginner-decision-2
family: mongodb.decision-2.beginner
skill: mongodb
type: scenario
level: beginner
minutes: 4
title: Single-document update
statement: MongoDB scenario assessment. Which operation changes selected fields without replacing the
  whole document? Choose the response that satisfies the stated technical requirement. This task assesses
  decisions and reasoning rather than running a full application.
competencies:
- indexes_performance
questions:
- id: q1
  prompt: Which operation changes selected fields without replacing the whole document?
  options:
  - id: q1-1
    text: Use an update operator such as $set with an explicit filter
  - id: q1-2
    text: Drop and recreate the collection for every edit
  - id: q1-3
    text: Overwrite unrelated fields with empty objects
answers:
  q1: q1-1
answer_rationale:
- Use an update operator such as $set with an explicit filter.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
