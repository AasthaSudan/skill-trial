slug: git-beginner-decision-2
family: git.decision-2.beginner
skill: git
type: scenario
level: beginner
minutes: 4
title: Independent branch
statement: Git scenario assessment. How can a feature develop independently of the main branch? Choose
  the response that satisfies the stated technical requirement. This task assesses decisions and reasoning
  rather than running a full application.
competencies:
- merges_conflicts
questions:
- id: q1
  prompt: How can a feature develop independently of the main branch?
  options:
  - id: q1-1
    text: Create and switch to a feature branch from the intended base
  - id: q1-2
    text: Rename every source file in main
  - id: q1-3
    text: Share one uncommitted working directory among developers
answers:
  q1: q1-1
answer_rationale:
- Create and switch to a feature branch from the intended base.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
