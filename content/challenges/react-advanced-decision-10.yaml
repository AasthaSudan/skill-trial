slug: react-advanced-decision-10
family: react.decision-10.advanced
skill: react
type: scenario
level: advanced
minutes: 8
title: State isolation failure
statement: React scenario assessment. Two independent forms accidentally share a mutable module object.
  What is the correct repair? Choose the response that satisfies the stated technical requirement. This
  task assesses decisions and reasoning rather than running a full application.
competencies:
- components_state
- effects_data
- rendering_accessibility
questions:
- id: q1
  prompt: Two independent forms accidentally share a mutable module object. What is the correct repair?
  options:
  - id: q1-1
    text: Give each form owned immutable state and explicit shared state only when intended
  - id: q1-2
    text: Mutate the shared object faster
  - id: q1-3
    text: Force a full browser reload after every keystroke
answers:
  q1: q1-1
answer_rationale:
- Give each form owned immutable state and explicit shared state only when intended.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
