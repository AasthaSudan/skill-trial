slug: nodejs-advanced-decision-9
family: nodejs.decision-9.advanced
skill: nodejs
type: scenario
level: advanced
minutes: 8
title: Graceful shutdown
statement: Node.js scenario assessment. A deployment sends termination while requests are active. What
  should the service do? Choose the response that satisfies the stated technical requirement. This task
  assesses decisions and reasoning rather than running a full application.
competencies:
- dependencies_security
questions:
- id: q1
  prompt: A deployment sends termination while requests are active. What should the service do?
  options:
  - id: q1-1
    text: Stop accepting new work, drain with a deadline and close resources
  - id: q1-2
    text: Exit before persisting acknowledged work
  - id: q1-3
    text: Ignore every termination signal indefinitely
answers:
  q1: q1-1
answer_rationale:
- Stop accepting new work, drain with a deadline and close resources.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
