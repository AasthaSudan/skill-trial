slug: aws-intermediate-decision-4
family: aws.decision-4.intermediate
skill: aws
type: scenario
level: intermediate
minutes: 6
title: Least privilege
statement: AWS scenario assessment. A worker only needs to read one application bucket. Which policy fits?
  Choose the response that satisfies the stated technical requirement. This task assesses decisions and
  reasoning rather than running a full application.
competencies:
- identity_access
questions:
- id: q1
  prompt: A worker only needs to read one application bucket. Which policy fits?
  options:
  - id: q1-1
    text: Grant the required read actions on the intended bucket resources
  - id: q1-2
    text: Grant administrator access to every resource
  - id: q1-3
    text: Make all buckets public to avoid access errors
answers:
  q1: q1-1
answer_rationale:
- Grant the required read actions on the intended bucket resources.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
