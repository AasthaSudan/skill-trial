slug: git-advanced-decision-8
family: git.decision-8.advanced
skill: git
type: scenario
level: advanced
minutes: 8
title: Force-push race
statement: Git scenario assessment. A rewritten branch must be pushed after coordination. What reduces
  overwriting a newer remote update? Choose the response that satisfies the stated technical requirement.
  This task assesses decisions and reasoning rather than running a full application.
competencies:
- merges_conflicts
questions:
- id: q1
  prompt: A rewritten branch must be pushed after coordination. What reduces overwriting a newer remote
    update?
  options:
  - id: q1-1
    text: Use force-with-lease after inspecting the expected remote state
  - id: q1-2
    text: Always force-push without checking
  - id: q1-3
    text: Delete collaborators' branches first
answers:
  q1: q1-1
answer_rationale:
- Use force-with-lease after inspecting the expected remote state.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
