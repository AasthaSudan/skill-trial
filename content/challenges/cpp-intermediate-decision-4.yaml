title: Move ownership
statement: C++ scenario assessment. A unique_ptr must transfer ownership to another owner. What expresses
  the transfer? Choose the response that satisfies the stated technical requirement. This task assesses
  decisions and reasoning rather than running a full application.
competencies:
- ownership_lifetimes
questions:
- id: q1
  prompt: A unique_ptr must transfer ownership to another owner. What expresses the transfer?
  options:
  - id: q1-1
    text: Move it and treat the source as no longer owning the resource
  - id: q1-2
    text: Copy it into two independent owners
  - id: q1-3
    text: Call delete on both owners
answers:
  q1: q1-1
answer_rationale:
- Move it and treat the source as no longer owning the resource.
