title: Await an operation
statement: Node.js scenario assessment. A function returns a promise for a user record. How should the
  handler obtain the record? Choose the response that satisfies the stated technical requirement. This
  task assesses decisions and reasoning rather than running a full application.
competencies:
- http_services
questions:
- id: q1
  prompt: A function returns a promise for a user record. How should the handler obtain the record?
  options:
  - id: q1-1
    text: Await the promise and handle failure
  - id: q1-2
    text: Read fields from the unresolved promise
  - id: q1-3
    text: Return before starting the operation
answers:
  q1: q1-1
answer_rationale:
- Await the promise and handle failure.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
