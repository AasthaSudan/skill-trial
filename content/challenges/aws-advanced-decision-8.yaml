slug: aws-advanced-decision-8
family: aws.decision-8.advanced
skill: aws
type: scenario
level: advanced
minutes: 8
title: Public bucket incident
statement: AWS scenario assessment. An internal upload bucket becomes publicly readable. What is the immediate
  priority? Choose the response that satisfies the stated technical requirement. This task assesses decisions
  and reasoning rather than running a full application.
competencies:
- compute_scaling
questions:
- id: q1
  prompt: An internal upload bucket becomes publicly readable. What is the immediate priority?
  options:
  - id: q1-1
    text: Contain public access and assess exposure while preserving audit evidence
  - id: q1-2
    text: Delete all audit logs first
  - id: q1-3
    text: Keep access public until the next release
answers:
  q1: q1-1
answer_rationale:
- Contain public access and assess exposure while preserving audit evidence.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
