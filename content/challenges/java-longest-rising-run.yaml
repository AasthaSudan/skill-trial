title: Longest rising run
statement: Return the length of the longest contiguous strictly increasing run. Equal neighboring
  values break a run. Empty input returns zero. The algorithm should scan the input once.
competencies: &id001
- collections
- algorithms
- edge_cases
language: java
starter: "class Solution {\n    public static Object solve(int[] nums) {\n        // Return the requested\
  \ result.\n        return null;\n    }\n}"
reference: class Solution { public static Object solve(int[] nums) { if(nums.length==0)return 0; int
  best=1,current=1; for(int i=1;i<nums.length;i++){current=nums[i]>nums[i-1]?current+1:1;best=Math.max(best,current);}
  return best; } }
hints:
