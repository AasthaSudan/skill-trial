title: Unsound assertion
statement: TypeScript scenario assessment. A shared helper asserts arbitrary JSON is an authenticated
  user. What is the correct repair? Choose the response that satisfies the stated technical requirement.
  This task assesses decisions and reasoning rather than running a full application.
competencies:
- types_narrowing
- generics_contracts
- runtime_boundaries
questions:
- id: q1
  prompt: A shared helper asserts arbitrary JSON is an authenticated user. What is the correct repair?
  options:
  - id: q1-1
    text: Validate shape and authentication evidence at the boundary before returning a trusted type
  - id: q1-2
    text: Move the assertion into a shorter function name
  - id: q1-3
    text: Turn off strict mode so the error disappears
answers:
  q1: q1-1
answer_rationale:
- Validate shape and authentication evidence at the boundary before returning a trusted type.
