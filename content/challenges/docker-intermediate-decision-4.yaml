slug: docker-intermediate-decision-4
family: docker.decision-4.intermediate
skill: docker
type: scenario
level: intermediate
minutes: 6
title: Build cache
statement: Docker scenario assessment. Dependencies change less often than application source. Which Dockerfile
  order improves cache reuse? Choose the response that satisfies the stated technical requirement. This
  task assesses decisions and reasoning rather than running a full application.
competencies:
- images_builds
questions:
- id: q1
  prompt: Dependencies change less often than application source. Which Dockerfile order improves cache
    reuse?
  options:
  - id: q1-1
    text: Copy dependency manifests and install before copying changing source
  - id: q1-2
    text: Copy every source file before every dependency installation
  - id: q1-3
    text: Disable every cache and rebuild unchanged dependencies
answers:
  q1: q1-1
answer_rationale:
- Copy dependency manifests and install before copying changing source.
hints:
- Identify the requirement and the boundary where it must hold.
- Compare the failure behavior of every choice.
explanation_prompt: Explain why your choice fits this scenario and how you would verify its behavior.
explanation_rubric:
- Names the relevant technical boundary.
- Connects the choice to the failure or correctness requirement.
- Gives a concrete verification step.
