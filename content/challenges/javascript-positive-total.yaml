type: coding
title: A positive contribution
statement: Return the sum of all **strictly positive** values in nums. Zero and negative
  values contribute nothing. For an empty array return 0. The total can exceed a 32-bit
  integer.
competencies: &id001
- algorithms
- edge_cases
language: javascript
starter: "function solve(nums) {\n  // Return the requested value.\n  return null;\n\
  }\n"
reference: function solve(nums) { return nums.filter(n=>n>0).reduce((a,b)=>a+b,0);
  }
