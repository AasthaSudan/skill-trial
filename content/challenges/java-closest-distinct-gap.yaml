title: Closest distinct values
statement: Return the smallest absolute difference between any two distinct values. Repeated copies
  of one value do not form a pair. Return null when fewer than two distinct values exist. Integer
  endpoints may be far apart.
competencies: &id001
- collections
- algorithms
- edge_cases
language: java
starter: "class Solution {\n    public static Object solve(int[] nums) {\n        // Return the requested\
  \ result.\n        return null;\n    }\n}"
reference: class Solution { public static Object solve(int[] nums) { java.util.TreeSet<Integer> values=new
  java.util.TreeSet<>(); for(int x:nums)values.add(x); if(values.size()<2)return null; long best=Long.MAX_VALUE;
  Integer previous=null; for(int x:values){if(previous!=null)best=Math.min(best,(long)x-previous);previous=x;}
  return best; } }
