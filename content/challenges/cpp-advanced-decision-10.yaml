title: Concurrent lifetime
statement: C++ scenario assessment. One thread reads an object while another may destroy it. What is necessary?
  Choose the response that satisfies the stated technical requirement. This task assesses decisions and
  reasoning rather than running a full application.
competencies:
- ownership_lifetimes
- containers_algorithms
- bounds_correctness
questions:
- id: q1
  prompt: One thread reads an object while another may destroy it. What is necessary?
  options:
  - id: q1-1
    text: A synchronization and lifetime ownership protocol that keeps readers valid
  - id: q1-2
    text: Only making the raw pointer volatile
  - id: q1-3
    text: Assuming a const reference prevents another thread from destroying the object
answers:
  q1: q1-1
answer_rationale:
- A synchronization and lifetime ownership protocol that keeps readers valid.
