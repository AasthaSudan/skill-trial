title: Async blocking
statement: C# scenario assessment. A server method blocks on an async operation with Result. What should
  be considered? Choose the response that satisfies the stated technical requirement. This task assesses
  decisions and reasoning rather than running a full application.
competencies:
- async_resources
questions:
- id: q1
  prompt: A server method blocks on an async operation with Result. What should be considered?
  options:
  - id: q1-1
    text: Use async/await through the call chain and avoid unnecessary synchronous blocking
  - id: q1-2
    text: Add more nested blocking waits
  - id: q1-3
    text: Assume async APIs never consume threads or locks
answers:
  q1: q1-1
answer_rationale:
- Use async/await through the call chain and avoid unnecessary synchronous blocking.
